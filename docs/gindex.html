<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Spelling Bee</title>
<style>
body{font-family:Arial;background:#f4f4f4;text-align:center;padding:20px}
.container{max-width:1000px;margin:auto;background:white;padding:20px;border-radius:20px}
.wordTable{width:100%;border-collapse:collapse}
.wordTable td{border:1px solid #ccc;padding:8px;font-size:20px}
button{padding:12px 20px;margin:8px;font-size:18px}
#wordBox{font-size:42px;font-weight:bold;background:linear-gradient(135deg,#4facfe,#00f2fe);color:white;padding:30px;border-radius:20px;margin:20px;line-height:1.4;overflow:visible;white-space:normal}
#timer{font-size:40px;color:red}
</style></head><body><div class="container">
<h1>Upload Spelling Bee</h1>
<input type="file" id="fileInput" accept=".txt,.xlsx,.xls"><div id="loaded"></div>
<details><summary style="font-size:24px">📚 Show / Hide Words</summary></details>
<br><label>Timer:</label><select id="timeInput"><option value="3" >3</option><option value="4" >4</option><option value="5" >5</option><option value="6" >6</option><option value="7" >7</option><option value="8" >8</option><option value="9" >9</option><option value="10" selected>10</option><option value="11" >11</option><option value="12" >12</option><option value="13" >13</option><option value="14" >14</option><option value="15" >15</option></select><br><br>
<button onclick="startGame()">Start</button>
<div id="wordBox">Press Start</div>
<div id="timer">⏳ 0</div>
<button onclick="speakWord()">🔊 Repeat</button>
<button id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
<button onclick="markCorrect()">✅ Correct</button>
<button onclick="markWrong()">❌ Wrong</button>
<button onclick="skipWord()">🔁 Skip</button>
<div style="font-size:24px">Correct: <span id="correctCount">0</span><br>Wrong: <span id="wrongCount">0</span><br>Remaining: <span id="remainingCount">0</span></div>
<div style="margin-top:20px;text-align:left"><h2>Wrong Words</h2><div id="wrongList">No mistakes yet</div></div>
</div>
<script>
let words=[];
let remainingWords=[];
let currentWord="";
let timer;
let timeLeft=0;
let correct=0;
let wrong=0;
let wrongWords=[];
let paused=false;

function startGame(){
if(words.length===0){alert('No words loaded');return;}
remainingWords=[...words];
correct=0;wrong=0;wrongWords=[];
updateScore();updateWrongList();
nextWord();
}

function nextWord(){
clearInterval(timer);
if(remainingWords.length===0){
document.getElementById('wordBox').innerText='🎉 Finished';
return;
}
let i=Math.floor(Math.random()*remainingWords.length);
currentWord=remainingWords[i];
remainingWords.splice(i,1);
document.getElementById('wordBox').innerText=currentWord;
speakWord();
timeLeft=parseInt(document.getElementById('timeInput').value)||10;
document.getElementById('timer').innerText='⏳ '+timeLeft;
timer=setInterval(function(){
if(paused) return;
timeLeft--;
document.getElementById('timer').innerText='⏳ '+timeLeft;
if(timeLeft<=0){
clearInterval(timer);
wrong++;
wrongWords.push(currentWord);
updateScore();
updateWrongList();
nextWord();
}
},1000);
updateScore();
}

function skipWord(){remainingWords.push(currentWord);nextWord();}
function speakWord(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(currentWord);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u);}
function togglePause(){paused=!paused;document.getElementById('pauseBtn').innerText=paused?'▶ Continue':'⏸ Pause';}
function markCorrect(){clearInterval(timer);correct++;updateScore();nextWord();}
function markWrong(){clearInterval(timer);wrong++;wrongWords.push(currentWord);updateScore();updateWrongList();nextWord();}
function updateScore(){document.getElementById('correctCount').innerText=correct;document.getElementById('wrongCount').innerText=wrong;document.getElementById('remainingCount').innerText=remainingWords.length;}
function updateWrongList(){
if(wrongWords.length===0){
document.getElementById('wrongList').innerHTML='No mistakes yet';
}else{
document.getElementById('wrongList').innerHTML=wrongWords.map((w,i)=>(i+1)+'. '+w).join('<br>');
}
}
</script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script>
document.getElementById('fileInput').addEventListener('change',function(e){
const file=e.target.files[0];
if(!file)return;
if(file.name.endsWith('.txt')){
const r=new FileReader();
r.onload=function(ev){words=ev.target.result.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);document.getElementById('loaded').innerText=words.length+' words loaded';};
r.readAsText(file);
}else{
const r=new FileReader();
r.onload=function(ev){
const data=new Uint8Array(ev.target.result);
const wb=XLSX.read(data,{type:'array'});
const sh=wb.Sheets[wb.SheetNames[0]];
const rows=XLSX.utils.sheet_to_json(sh,{header:1});
words=rows.map(r=>r[0]).filter(Boolean);
document.getElementById('loaded').innerText=words.length+' words loaded';
};
r.readAsArrayBuffer(file);
}
});
</script>
</body></html>
