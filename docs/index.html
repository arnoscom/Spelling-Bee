<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Al Jbour Spelling Bee - Free spelling practice for everyone" />
  <title>🐝 Al Jbour Spelling Bee</title>
  <style>
/* ===== CSS VARIABLES ===== */
:root {
  --bee-yellow: #FFD93D;
  --bee-orange: #FF9500;
  --bee-red: #FF3B30;
  --bee-green: #34C759;
  --bee-blue: #007AFF;
  --bee-purple: #AF52DE;
  --bee-pink: #FF2D55;
  --bee-teal: #5AC8FA;

  --bg-primary: #F9F5FF;
  --bg-card: #FFFFFF;
  --bg-card-hover: #F0EAFF;
  --text-primary: #1C1C3A;
  --text-secondary: #6B6B8A;
  --text-muted: #A0A0C0;
  --border-color: #E8E0FF;

  --shadow-sm: 0 2px 8px rgba(100, 60, 200, 0.08);
  --shadow-md: 0 4px 20px rgba(100, 60, 200, 0.12);
  --shadow-lg: 0 8px 32px rgba(100, 60, 200, 0.18);
  --shadow-card: 0 4px 16px rgba(100, 60, 200, 0.10);

  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;

  --font-display: -apple-system, 'SF Pro Rounded', 'Helvetica Neue', system-ui, sans-serif;
  --font-body: -apple-system, 'Helvetica Neue', system-ui, sans-serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

/* Dark Mode */
[data-theme="dark"] {
  --bg-primary: #0D0D1A;
  --bg-card: #1A1A2E;
  --bg-card-hover: #222240;
  --text-primary: #F0EAFF;
  --text-secondary: #A090C0;
  --text-muted: #6060A0;
  --border-color: #2A2A50;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
  --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.3);
}

/* ===== RESET & BASE ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

#app {
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ===== SCREEN CONTAINER ===== */
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  width: 100%;
  padding-top: calc(var(--safe-top) + 16px);
  padding-bottom: calc(var(--safe-bottom) + 16px);
  padding-left: calc(var(--safe-left) + 16px);
  padding-right: calc(var(--safe-right) + 16px);
  animation: screenIn 0.3s ease;
}

@keyframes screenIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== SPLASH SCREEN ===== */
.splash-screen {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #667eea 0%, #764ba2 50%, #f64f59 100%);
  padding: 40px 20px;
  gap: 0;
  z-index: 999;
  box-sizing: border-box;
}

.splash-bee {
  font-size: 96px;
  animation: beeBounce 1.2s ease-in-out infinite alternate;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.2));
  margin-bottom: 16px;
}

@keyframes beeBounce {
  from { transform: translateY(0) rotate(-5deg) scale(1); }
  to { transform: translateY(-16px) rotate(5deg) scale(1.05); }
}

.splash-title {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 800;
  color: white;
  text-shadow: 0 4px 16px rgba(0,0,0,0.25);
  letter-spacing: -1px;
  text-align: center;
}

.splash-subtitle {
  font-family: var(--font-body);
  font-size: 18px;
  font-weight: 600;
  color: rgba(255,255,255,0.85);
  text-align: center;
  margin-top: 6px;
  letter-spacing: 0.3px;
}

.splash-greeting {
  font-size: 28px;
  margin-top: 24px;
  animation: fadeIn 1s ease 0.5s both;
}

.splash-dots {
  display: flex;
  gap: 8px;
  margin-top: 48px;
}

.splash-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
  animation: dotPulse 1.2s ease-in-out infinite;
}
.splash-dot:nth-child(2) { animation-delay: 0.2s; }
.splash-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotPulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.4); opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== HOME SCREEN ===== */
.home-screen {
  background: linear-gradient(180deg, #f0e6ff 0%, #e8f4ff 100%);
  min-height: 100%;
}

[data-theme="dark"] .home-screen {
  background: linear-gradient(180deg, #0D0D1A 0%, #0a0a20 100%);
}

.home-header {
  text-align: center;
  padding: 12px 0 20px;
}

.home-bee {
  font-size: 56px;
  display: block;
  animation: beeBounce 2s ease-in-out infinite alternate;
}

.home-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}

.home-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 600;
  margin-top: 2px;
}

.home-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
    padding:4px 0;
    width:100%;
}

@media (min-width:768px){

.home-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
}

}
.home-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 24px 16px;
  display: flex;
  width: 100%;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  border: none;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  position: relative;
  overflow: hidden;
  min-height: 130px;
  justify-content: center;
}

.home-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius-lg);
  opacity: 0.08;
}

.home-card:nth-child(1)::before { background: var(--bee-orange); }
.home-card:nth-child(2)::before { background: var(--bee-blue); }
.home-card:nth-child(3)::before { background: var(--bee-green); }
.home-card:nth-child(4)::before { background: var(--bee-purple); }

.home-card:active {
  transform: scale(0.96);
  box-shadow: var(--shadow-sm);
}

.home-card-icon {
  font-size: 42px;
  line-height: 1;
}

.home-card-label {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  text-align: center;
}

.home-card-desc {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 600;
  text-align: center;
}

/* ===== SCREEN HEADER ===== */
.screen-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.screen-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 800;
  color: var(--text-primary);
  flex: 1;
}

/* ===== BACK BUTTON ===== */
.back-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--bg-card);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s ease;
  flex-shrink: 0;
}

.back-btn:active { transform: scale(0.92); }

/* ===== LIST CARDS ===== */
.list-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow-card);
  margin-bottom: 12px;
  border: 2px solid transparent;
  transition: border-color 0.2s, transform 0.15s;
}

.list-card.selected {
  border-color: var(--bee-purple);
}

.list-card:active { transform: scale(0.98); }

.list-card-icon {
  font-size: 36px;
  flex-shrink: 0;
}

.list-card-info {
  flex: 1;
}

.list-card-name {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}

.list-card-count {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 600;
  margin-top: 2px;
}

.list-card-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

/* ===== BUTTONS ===== */
.btn {
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 700;
  transition: transform 0.15s ease, opacity 0.15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn:active { transform: scale(0.95); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 14px 24px;
  font-size: 16px;
  box-shadow: 0 4px 16px rgba(118, 75, 162, 0.35);
  border-radius: var(--radius-lg);
}

.btn-success {
  background: linear-gradient(135deg, #11998e, #38ef7d);
  color: white;
  padding: 14px 20px;
  font-size: 15px;
  box-shadow: 0 4px 14px rgba(17, 153, 142, 0.3);
}

.btn-danger {
  background: linear-gradient(135deg, #f64f59, #c0392b);
  color: white;
  padding: 14px 20px;
  font-size: 15px;
  box-shadow: 0 4px 14px rgba(246, 79, 89, 0.3);
}

.btn-warning {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1C1C3A;
  padding: 14px 20px;
  font-size: 15px;
  box-shadow: 0 4px 14px rgba(247, 151, 30, 0.3);
}

.btn-ghost {
  background: var(--bg-card);
  color: var(--text-primary);
  padding: 12px 18px;
  font-size: 14px;
  box-shadow: var(--shadow-sm);
  border: 2px solid var(--border-color);
}

.btn-sm {
  padding: 8px 16px;
  font-size: 13px;
  border-radius: var(--radius-sm);
}

.btn-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  padding: 0;
  font-size: 18px;
  background: var(--bg-card);
  box-shadow: var(--shadow-sm);
  border: 2px solid var(--border-color);
}

.btn-full {
  width: 100%;
}

/* ===== SETUP SCREEN ===== */
.setup-section {
  margin-bottom: 24px;
}

.setup-label {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.option-cards {
  display: flex;
  gap: 12px;
}

.option-card {
  flex: 1;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 18px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: 3px solid transparent;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}

.option-card.selected {
  border-color: var(--bee-purple);
  background: linear-gradient(135deg, rgba(118,75,162,0.08), rgba(102,126,234,0.08));
  box-shadow: 0 4px 16px rgba(118, 75, 162, 0.2);
}

.option-card:active { transform: scale(0.97); }

.option-card-icon { font-size: 36px; }

.option-card-label {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
}

.option-card-desc {
  font-size: 11px;
  color: var(--text-secondary);
  text-align: center;
  font-weight: 600;
}

/* Timer Slider */
.timer-slider-wrapper {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}

.timer-value-display {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 800;
  color: var(--bee-purple);
  text-align: center;
  margin-bottom: 8px;
}

.timer-value-display.off {
  color: var(--text-muted);
}

.slider {
  width: 100%;
  -webkit-appearance: none;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(to right, var(--bee-purple) 0%, var(--bee-purple) var(--slider-pct, 50%), var(--border-color) var(--slider-pct, 50%), var(--border-color) 100%);
  outline: none;
  cursor: pointer;
}

.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  box-shadow: 0 2px 12px rgba(118, 75, 162, 0.4);
  cursor: pointer;
}

.slider-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 700;
}

/* ===== PRACTICE SCREEN ===== */
.practice-header {
  text-align: center;
  margin-bottom: 20px;
}

.word-counter {
  display: none !important;
}

.word-num-side { display: none !important; }

.word-num-center { display: none !important; }

/* Progress Bar */
.progress-bar-wrap {
  height: 28px;
  background: var(--border-color);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 0;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  border-radius: 14px;
  transition: width 0.4s ease;
}

/* Timer Circle */
.timer-circle-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  margin-bottom: 0;
}


.timer-track {
  fill: none;
  stroke: var(--border-color);
  stroke-width: 8;
}

.timer-fill {
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.95s linear, stroke 0.3s ease;
}

.timer-fill.green { stroke: var(--bee-green); }
.timer-fill.orange { stroke: var(--bee-orange); }
.timer-fill.red { stroke: var(--bee-red); }

/* Word Display */
.word-display {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 20px;
  text-align: center;
  box-shadow: var(--shadow-md);
  margin-bottom: 16px;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.word-text {
  font-family: var(--font-display);
  font-size: 40px;
  font-weight: 900;
  color: var(--bee-purple);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.word-input {
  width: 100%;
  border: 3px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  background: var(--bg-card);
  outline: none;
  text-align: center;
  transition: border-color 0.2s;
}

.word-input:focus { border-color: var(--bee-purple); }
.word-input::placeholder { color: var(--text-muted); font-size: 16px; font-weight: 600; }

/* Practice Buttons */
.practice-btns-row {
  display: grid;
  gap: 10px;
  margin-bottom: 10px;
}

.practice-btns-row-1 {
  grid-template-columns: 1fr 1fr 1fr 1fr;
}

.practice-btns-row-2 {
  grid-template-columns: 1fr 1fr;
}

.practice-btns-row-3 {
  grid-template-columns: 1fr;
}

.practice-btn {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s, box-shadow 0.15s;
}

.practice-btn:active { transform: scale(0.94); }

.practice-btn-icon { font-size: 22px; }

.practice-btn-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  font-family: var(--font-body);
}

.practice-btn.correct {
  background: linear-gradient(135deg, rgba(52,199,89,0.15), rgba(52,199,89,0.05));
  border-color: var(--bee-green);
}

.practice-btn.wrong {
  background: linear-gradient(135deg, rgba(255,59,48,0.15), rgba(255,59,48,0.05));
  border-color: var(--bee-red);
}

.practice-btn.exit {
  background: linear-gradient(135deg, rgba(255,149,0,0.15), rgba(255,149,0,0.05));
  border-color: var(--bee-orange);
  grid-column: 1 / -1;
}

/* ===== RESULTS SCREEN ===== */
.results-hero {
  text-align: center;
  padding: 24px 0 16px;
}

.results-score {
  font-family: var(--font-display);
  font-size: 72px;
  font-weight: 900;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.results-label {
  font-size: 15px;
  color: var(--text-secondary);
  font-weight: 700;
  margin-top: 4px;
}

.stars-row {
  font-size: 40px;
  letter-spacing: 4px;
  margin: 12px 0;
}

.results-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-card);
  margin-bottom: 14px;
}

.results-card-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-size: 13px;
}

.wrong-word-pill {
  display: inline-flex;
  background: rgba(255, 59, 48, 0.1);
  border: 2px solid rgba(255, 59, 48, 0.3);
  border-radius: 100px;
  padding: 6px 14px;
  font-size: 14px;
  font-weight: 700;
  color: var(--bee-red);
  margin: 4px;
  font-family: var(--font-display);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.results-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ===== HISTORY SCREEN ===== */
.history-stat-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.history-stat-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 14px 10px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.history-stat-val {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 900;
  color: var(--bee-purple);
}

.history-stat-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 700;
  margin-top: 2px;
}

.history-record {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 12px;
}

.history-record-score {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 900;
  color: var(--bee-purple);
  min-width: 48px;
}

.history-record-info {
  flex: 1;
}

.history-record-list {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
}

.history-record-date {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
  margin-top: 2px;
}

.history-record-badge {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1C1C3A;
  border-radius: 100px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 800;
}

/* ===== SETTINGS SCREEN ===== */
.settings-section {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  margin-bottom: 18px;
}

.settings-row {
  display: flex;
  align-items: center;
  padding: 16px 18px;
  gap: 14px;
  border-bottom: 1px solid var(--border-color);
}

.settings-row:last-child { border-bottom: none; }

.settings-row-icon { font-size: 24px; }

.settings-row-info { flex: 1; }

.settings-row-label {

}

/* Toggle */
.toggle {
  position: relative;
  width: 52px;
  height: 30px;
}

.toggle input { display: none; }

.toggle-track {
  position: absolute;
  inset: 0;
  border-radius: 15px;
  background: var(--border-color);
  cursor: pointer;
  transition: background 0.2s;
}

.toggle input:checked + .toggle-track { background: var(--bee-purple); }

.toggle-track::after {
  content: '';
  position: absolute;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: white;
  top: 3px;
  left: 3px;
  transition: transform 0.2s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.toggle input:checked + .toggle-track::after { transform: translateX(22px); }

/* ===== LIST MANAGEMENT ===== */
.list-mgmt-actions {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.word-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: 100px;
  padding: 6px 12px 6px 14px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  margin: 4px;
  font-family: var(--font-display);
  text-transform: capitalize;
  letter-spacing: 0.5px;
}

.word-pill-del {
  background: none;
  border: none;
  font-size: 14px;
  cursor: pointer;
  color: var(--bee-red);
  padding: 0;
  display: flex;
  align-items: center;
}

.words-container {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 14px;
  min-height: 80px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  animation: fadeIn 0.2s ease;
}

.modal-box {
  background: var(--bg-card);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 24px 20px calc(24px + var(--safe-bottom));
  width: 100%;
  max-width: 500px;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 16px;
  text-align: center;
}

.modal-input {
  width: 100%;
  border: 3px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  background: var(--bg-primary);
  outline: none;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}

.modal-input:focus { border-color: var(--bee-purple); }

.modal-btns {
  display: flex;
  gap: 10px;
}

.modal-btns .btn { flex: 1; }

/* ===== SECTION HEADING ===== */
.section-heading {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;

  text-transform: uppercase;

/* ===== EMPTY STATE ===== */

.empty-state-sub {

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: calc(24px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(0);
  background: var(--text-primary);
  color: var(--bg-primary);
  padding: 12px 24px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 700;
  z-index: 200;
  white-space: nowrap;
  animation: toastIn 0.25s ease, toastOut 0.25s ease 2s forwards;
  pointer-events: none;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(16px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@keyframes toastOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

// ── storage.js ──
// IndexedDB storage layer — iOS Safari safe

const DB_NAME = 'AlJbourSpellingBee';
const DB_VERSION = 1;

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;

  dbPromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains('lists')) {
        db.createObjectStore('lists', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('history')) {
        db.createObjectStore('history', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
      if (!db.objectStoreNames.contains('records')) {
        db.createObjectStore('records', { keyPath: 'id', autoIncrement: true });
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('IndexedDB blocked'));
  });

  return dbPromise;
}

function promisifyRequest(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

// Each operation gets a fresh transaction — iOS Safari closes transactions quickly
async function withStore(storeName, mode, fn) {
  const db = await openDB();
  const tx = db.transaction(storeName, mode);
  const store = tx.objectStore(storeName);
  return fn(store, tx);
}

// ---- LISTS ----
async function getLists() {
  return withStore('lists', 'readonly', (store) =>
    promisifyRequest(store.getAll())
  );
}

async function getList(id) {
  return withStore('lists', 'readonly', (store) =>
    promisifyRequest(store.get(id))
  );
}

async function saveList(list) {
  return withStore('lists', 'readwrite', (store) =>
    promisifyRequest(store.put(list))
  );
}

async function deleteList(id) {
  return withStore('lists', 'readwrite', (store) =>
    promisifyRequest(store.delete(id))
  );
}

// ---- HISTORY ----
async function getHistory() {
  return withStore('history', 'readonly', (store) =>
    promisifyRequest(store.getAll())
  );
}

async function addHistory(entry) {
  await withStore('history', 'readwrite', (store) =>
    promisifyRequest(store.add(entry))
  );

  const all = await withStore('history', 'readonly', (store) =>
    promisifyRequest(store.getAll())
  );

  if (all.length > 100) {
    const sorted = [...all].sort((a, b) => (a.id || 0) - (b.id || 0));
    const toDelete = sorted.slice(0, all.length - 100);
    for (const item of toDelete) {
      await withStore('history', 'readwrite', (store) =>
        promisifyRequest(store.delete(item.id))
      );
    }
  }
}

async function clearHistory() {
  return withStore('history', 'readwrite', (store) =>
    promisifyRequest(store.clear())
  );
}

// ---- SETTINGS ----
async function getSetting(key) {
  try {
    const result = await withStore('settings', 'readonly', (store) =>
      promisifyRequest(store.get(key))
    );
    return result ? result.value : null;
  } catch (e) {
    console.warn('getSetting failed for key:', key, e);
    return null;
  }
}

async function setSetting(key, value) {
  return withStore('settings', 'readwrite', (store) =>
    promisifyRequest(store.put({ key, value }))
  );
}

// ---- RECORDS (top 10) ----
async function getRecords() {
  return withStore('records', 'readonly', (store) =>
    promisifyRequest(store.getAll())
  );
}

async function addRecord(record) {
  await withStore('records', 'readwrite', (store) =>
    promisifyRequest(store.add(record))
  );

  const all = await withStore('records', 'readonly', (store) =>
    promisifyRequest(store.getAll())
  );

  if (all.length > 10) {
    const sortedByAccuracy = [...all].sort(
      (a, b) => (b.score / b.total) - (a.score / a.total)
    );
    const toRemove = sortedByAccuracy.slice(10);
    for (const item of toRemove) {
      await withStore('records', 'readwrite', (store) =>
        promisifyRequest(store.delete(item.id))
      );
    }
  }
}


// ── speech.js ──
// ─────────────────────────────────────────────────────────────────────
// speech.js — Forces specific named iOS voices.
//
// iOS ships with these English voices pre-installed on iPad:
//   Samantha  (en-US, female) — always present
//   Daniel    (en-GB, male)   — pre-installed on most iPads
//
// Additional voices can be downloaded ONCE in:
//   Settings → Accessibility → Spoken Content → Voices → English
// After download they work fully offline forever.
//
// This module picks voices by EXACT NAME so we always get the right
// gender. If the preferred voice isn't installed yet, it shows the
// user a one-time prompt with instructions to install it.
// ─────────────────────────────────────────────────────────────────────

const synth = window.speechSynthesis;
let cachedVoice     = null;
let cachedProfileId = null;
let allVoices       = [];

// Priority lists: first name found on device wins.
// These are real iOS/iPadOS voice names in priority order.
const VOICE_PRIORITY = {
  'en-US-male':   ['Alex', 'Fred', 'Tom', 'Daniel'],                    // Alex = US male, pre-installed
  'en-US-female': ['Samantha', 'Ava', 'Allison', 'Susan', 'Victoria'],  // Samantha = always there
  'en-GB-male':   ['Daniel', 'Arthur', 'Oliver', 'Harry'],              // Daniel = GB male, common on iPad
  'en-GB-female': ['Kate', 'Serena', 'Martha', 'Moira'],
  'en-AU-female': ['Karen', 'Catherine', 'Lee'],
};

const VOICE_PROFILES = [
  { id: 'en-US-male',   label: 'American Man',  emoji: '🇺🇸👨', lang: 'en-US', gender: 'male',   pitch: 1.0, rate: 0.85 },
  { id: 'en-US-female', label: 'American Woman', emoji: '🇺🇸👩', lang: 'en-US', gender: 'female', pitch: 1.0, rate: 0.9  },
  { id: 'en-GB-male',   label: 'British Man',    emoji: '🇬🇧👨', lang: 'en-GB', gender: 'male',   pitch: 1.0, rate: 0.85 },
  { id: 'en-GB-female', label: 'British Woman',  emoji: '🇬🇧👩', lang: 'en-GB', gender: 'female', pitch: 1.0, rate: 0.9  },
  { id: 'en-AU-female', label: 'Australian',     emoji: '🇦🇺👩', lang: 'en-AU', gender: 'female', pitch: 1.0, rate: 0.9  },
];

// ── Load all available voices from the device ──────────────────────
function getVoiceList() {
  return new Promise(resolve => {
    const v = synth.getVoices();
    if (v.length > 0) { allVoices = v; resolve(v); return; }
    synth.onvoiceschanged = () => { allVoices = synth.getVoices(); resolve(allVoices); };
    setTimeout(() => { allVoices = synth.getVoices(); resolve(allVoices); }, 1500);
  });
}

// ── Pick voice by exact name priority list ─────────────────────────
function pickVoice(profileId, voices) {
  const priorities = VOICE_PRIORITY[profileId] || [];
  
  // 1. Try exact name match (case-insensitive)
  for (const name of priorities) {
    const found = voices.find(v => v.name.toLowerCase() === name.toLowerCase());
    if (found) return { voice: found, installed: true };
  }

  // 2. Try partial name match
  for (const name of priorities) {
    const found = voices.find(v => v.name.toLowerCase().includes(name.toLowerCase()));
    if (found) return { voice: found, installed: true };
  }

  // 3. Not installed — return null so we can prompt user
  return { voice: null, installed: false };
}

// ── Get the preferred (not-yet-installed) voice name for a profile ──
function getPreferredVoiceName(profileId) {
  return (VOICE_PRIORITY[profileId] || ['Unknown'])[0];
}

// ── Check which profiles have their preferred voice installed ───────
async function checkInstalledVoices() {
  const voices = await getVoiceList();
  const status = {};
  for (const profile of VOICE_PROFILES) {
    const { voice } = pickVoice(profile.id, voices);
    status[profile.id] = {
      installed: !!voice,
      voiceName: voice ? voice.name : getPreferredVoiceName(profile.id),
    };
  }
  return status;
}

// ── Load and cache a voice profile ────────────────────────────────
async function loadVoiceProfile(profileId) {
  const profile = VOICE_PROFILES.find(p => p.id === profileId) || VOICE_PROFILES[1];
  const voices  = await getVoiceList();
  const { voice, installed } = pickVoice(profileId, voices);

  if (voice) {
    cachedVoice     = voice;
    cachedProfileId = profileId;
  } else {
    // Voice not installed — fall back to any available English voice
    // but keep the profileId so pitch still applies
    const fallback = voices.find(v => v.lang.startsWith('en')) || voices[0];
    cachedVoice     = fallback || null;
    cachedProfileId = profileId;
  }

  return { profile, installed };
}

// ── Speak a word ───────────────────────────────────────────────────
async function speakWord(text, profileId = null) {
  if (!synth) return;
  synth.cancel();

  if (profileId) {
    await loadVoiceProfile(profileId);
  } else if (!cachedProfileId) {
    await loadVoiceProfile('en-US-female');
  }

  const profile = VOICE_PROFILES.find(p => p.id === cachedProfileId);
  if (!profile) return;

  const utt = new SpeechSynthesisUtterance(text);
  if (cachedVoice) {
    utt.voice = cachedVoice;
    utt.lang  = cachedVoice.lang;
  } else {
    utt.lang = profile.lang;
  }
  utt.pitch  = profile.pitch;
  utt.rate   = profile.rate;
  utt.volume = 1;
  synth.speak(utt);
}

function stopSpeaking() {
  if (synth) synth.cancel();
}

function normalizeAnswer(str) {

// ── timer.js ──
let timerId = null;
let remaining = 0;
let onTickCb = null;
let onDoneCb = null;

function startTimer(duration, onTick, onDone) {
  stopTimer();
  remaining = duration;
  onTickCb = onTick;
  onDoneCb = onDone;
  onTick && onTick(remaining, duration);
  timerId = setInterval(() => {
    remaining--;
    onTickCb && onTickCb(remaining, duration);
    if (remaining <= 0) { stopTimer(); onDoneCb && onDoneCb(); }
  }, 1000);
}

function pauseTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
}

function resumeTimer(onTick, onDone, duration) {
  if (timerId) return;
  onTickCb = onTick || onTickCb;
  onDoneCb = onDone || onDoneCb;
  timerId = setInterval(() => {
    remaining--;
    onTickCb && onTickCb(remaining, duration);
    if (remaining <= 0) { stopTimer(); onDoneCb && onDoneCb(); }
  }, 1000);
}

function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  remaining = 0;
}

async function seedDefaults() {
  const ids = (await getLists()).map(l => l.id);
  if (!ids.includes(DEFAULT_JAD.id))  await saveList(DEFAULT_JAD);
  if (!ids.includes(DEFAULT_ADAM.id)) await saveList(DEFAULT_ADAM);
}

async function getAllLists() {
  await seedDefaults();
  return getLists();
}

async function createList(name, words = []) {
  const icons = ['📚','🌈','⭐','🎯','🎪','🦋','🌺','🎨'];
  const list = { id: 'list-' + Date.now(), name, icon: icons[Math.floor(Math.random() * icons.length)], words };
  await saveList(list);
  return list;
}

async function removeList(id) { await deleteList(id); }

async function addWordToList(listId, word) {
  const list = await getList(listId);
  if (!list) return;
  const w = word.trim().toLowerCase();
  if (!w || list.words.includes(w)) return list;
  list.words.push(w);
  await saveList(list);
  return list;
}

async function removeWordFromList(listId, word) {
  const list = await getList(listId);
  if (!list) return;
  list.words = list.words.filter(w => w !== word);
  await saveList(list);
  return list;
}

function shuffleWords(words) {
  const arr = [...words];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function updateList(list) {
  await saveList(list);
  return list;
}

// ── ProgressBar.js ──
function ProgressBar(current, total) {
  const pct = total > 0 ? Math.min(current / total * 100, 100) : 0;
  const wrap = document.createElement('div');
  wrap.className = 'progress-bar-wrap';
  const fill = document.createElement('div');
  fill.className = 'progress-bar-fill';
  fill.style.width = `${pct}%`;
  wrap.appendChild(fill);
  wrap.update = (c, t) => {
    fill.style.width = `${t > 0 ? Math.min(c / t * 100, 100) : 0}%`;
  };
  return wrap;
}


// ── TimerCircle.js ──
function TimerCircle(duration) {
  const circumference = 2 * Math.PI * 38;
  const wrap = document.createElement('div');
  wrap.className = 'timer-circle-wrap';

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', 100);
  svg.setAttribute('height', 100);
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.style.display = 'block';

  const track = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  track.setAttribute('cx', 50); track.setAttribute('cy', 50); track.setAttribute('r', 38);
  track.classList.add('timer-track');

  const fill = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  fill.setAttribute('cx', 50); fill.setAttribute('cy', 50); fill.setAttribute('r', 38);
  fill.classList.add('timer-fill', 'green');
  fill.setAttribute('stroke-dasharray', circumference);
  fill.setAttribute('stroke-dashoffset', 0);
  fill.style.transformOrigin = '50px 50px';
  fill.style.transform = 'rotate(-90deg)';

  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', 50); text.setAttribute('y', 50);
  text.setAttribute('text-anchor', 'middle'); text.setAttribute('dy', '0.35em');
  text.style.fontFamily = "'Lexend', sans-serif";
  text.style.fontWeight = '900';
  text.style.fontSize = '26px';
  text.style.fill = 'var(--text-primary)';
  text.textContent = duration === 0 ? '∞' : duration;

  svg.appendChild(track); svg.appendChild(fill); svg.appendChild(text);
  wrap.appendChild(svg);

  wrap.update = (remaining, total) => {
    if (total === 0) {
      text.textContent = '∞';
      fill.setAttribute('stroke-dashoffset', 0);
      fill.classList.remove('green', 'orange', 'red');
      fill.classList.add('green');
      return;
    }
    const offset = circumference * (1 - Math.max(0, remaining / total));
    fill.setAttribute('stroke-dashoffset', offset);
    text.textContent = remaining <= 0 ? '0' : String(remaining);
    fill.classList.remove('green', 'orange', 'red');
    if (remaining > 7)      { fill.classList.add('green');  text.style.fill = 'var(--text-primary)'; }
    else if (remaining > 3) { fill.classList.add('orange'); text.style.fill = 'var(--bee-orange)'; }
    else                    { fill.classList.add('red');    text.style.fill = 'var(--bee-red)'; }
  };

  return wrap;
}

function showToast(message, duration = 2500) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, duration);
}


// ── ListCard.js ──
function ListCard({ list, onSelect, onEdit, onDelete, showActions = false, selected = false }) {
  const card = document.createElement('div');
  card.className = 'list-card' + (selected ? ' selected' : '');

  const icon = document.createElement('div');
  icon.className = 'list-card-icon';
  icon.textContent = list.icon || '📚';

  const info = document.createElement('div');
  info.className = 'list-card-info';

  const name = document.createElement('div');
  name.className = 'list-card-name';
  name.textContent = list.name;

  const count = document.createElement('div');
  count.className = 'list-card-count';
  count.textContent = `${list.words.length} words`;

  info.appendChild(name);
  info.appendChild(count);
  card.appendChild(icon);
  card.appendChild(info);

  if (showActions && (onEdit || onDelete)) {
    const actions = document.createElement('div');
    actions.className = 'list-card-actions';
    if (onEdit) {
      const editBtn = document.createElement('button');
      editBtn.className = 'btn btn-icon';
      editBtn.textContent = '✏️';
      editBtn.addEventListener('click', (e) => { e.stopPropagation(); onEdit(list); });
      actions.appendChild(editBtn);
    }
    if (onDelete) {
      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn-icon';
      delBtn.textContent = '🗑️';
      delBtn.addEventListener('click', (e) => { e.stopPropagation(); onDelete(list); });
      actions.appendChild(delBtn);
    }
    card.appendChild(actions);
  }

  if (onSelect) {
    card.style.cursor = 'pointer';
    card.addEventListener('click', () => onSelect(list));
  }

  return card;
}

function renderHome(container) {

  screen.className = 'screen home-screen';

  const header = document.createElement('div');
  header.className = 'home-header';
  header.innerHTML = `
    <span class="home-bee">🐝</span>
    <div class="home-title">Al Jbour</div>
    <div class="home-subtitle">Spelling Bee Practice App</div>
  `;
  screen.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'home-grid';

  const cards = [
    { nav: 'practice',       icon: '🎯', label: 'Practice', desc: 'Start spelling!' },
    { nav: 'listManagement', icon: '📚', label: 'Lists',    desc: 'Manage words' },
    { nav: 'settings',       icon: '⚙️', label: 'Settings', desc: 'Customize app' },
    { nav: 'history',        icon: '🏆', label: 'History',  desc: 'Your records' },
  ];

  cards.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'home-card';
    btn.innerHTML = `
      <div class="home-card-icon">${c.icon}</div>
      <div class="home-card-label">${c.label}</div>
      <div class="home-card-desc">${c.desc}</div>
    `;
    btn.addEventListener('click', () => navigate(c.nav));
    grid.appendChild(btn);
  });

  screen.appendChild(grid);

  // Force correct layout using actual physical screen size
  // window.innerWidth can be wrong in Capacitor on iPad —
  // use screen.width which always returns the real hardware width
  function applyLayout() {
    const physicalWidth = Math.max(
      window.screen.width,
      window.screen.height, // landscape
      window.innerWidth,
      document.documentElement.clientWidth
    );

    // iPad Air 11" = 820pt wide. Any device >= 700pt is a tablet.
    const isTablet = physicalWidth >= 700;

    // Force the grid to 4 columns on tablet, 2 on phone
    grid.style.gridTemplateColumns = isTablet
      ? 'repeat(4, 1fr)'
      : 'repeat(2, 1fr)';
    grid.style.gap = isTablet ? '20px' : '14px';

    // Force screen and container to full width
    screen.style.width = '100%';
    screen.style.minWidth = '100%';
    container.style.width = '100%';
    container.style.minWidth = '100%';

    // Force cards to be bigger on tablet
    if (isTablet) {
      grid.querySelectorAll('.home-card').forEach(card => {
        card.style.minHeight = '160px';
        card.style.padding = '32px 20px';
      });
      grid.querySelectorAll('.home-card-icon').forEach(el => {
        el.style.fontSize = '52px';
      });
    }
  }

  applyLayout();
  // Re-apply on resize (orientation change)
  window.addEventListener('resize', applyLayout);
  // Also after a tick in case WebView hasn't settled
  setTimeout(applyLayout, 100);
  setTimeout(applyLayout, 500);

  container.appendChild(screen);
}

// ── test.js ──









function renderTest(container) {
  const state = getState();
  const words = state.retryWords ? [...state.retryWords] : [...state.practiceWords];
  const total = words.length;
  const isCoach = state.practiceMode === 'coach';
  let currentIdx = 0;
  let isPaused = false;
  let correctCount = 0;
  const wrongWords = [];
  let stopwatchSeconds = 0;
  let stopwatchInterval = null;

  if (total === 0) { navigate('home'); return; }

  const voiceProfile = state.voiceProfile || 'en-US-female';
  const timerDuration = state.timerDuration || 0;

  // ─────────────────────────────────────────
  // SELF-TEST: fixed-layout screen that fits
  // perfectly above the keyboard.
  // COACH: normal scrollable screen.
  // ─────────────────────────────────────────

  if (!isCoach) {
    renderSelfTest();
  } else {
    renderCoachTest();
  }

  // ══════════════════════════════════════════════════════
  // SELF TEST — fixed layout, keyboard always open
  // Screen is split: everything sits in the top visible
  // area. Uses position:fixed + visualViewport height.
  // ══════════════════════════════════════════════════════
  function renderSelfTest() {
    // ─────────────────────────────────────────────────────
    // SELF TEST LAYOUT — everything is static, nothing moves
    //
    // Structure (top to bottom, all fixed heights):
    //   [Progress bar row]          — flex-shrink:0
    //   [Stats: ✅ N  ⏱ 0:00  N ❌] — flex-shrink:0
    //   [Timer row: circle + feedback side by side] — flex-shrink:0
    //   [Input row: text box + Submit button inline] — flex-shrink:0
    //   [Action row: Spell | Pause | Skip | Exit]   — flex-shrink:0
    //
    // Feedback shows INSIDE the timer row (next to the circle).
    // Submit is INLINE with the input (right side).
    // Nothing shifts when feedback appears.
    // ─────────────────────────────────────────────────────

    const wrapper = document.createElement('div');
    wrapper.id = 'self-test-wrapper';
    wrapper.style.cssText = `
      position: fixed;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      box-sizing: border-box;
      z-index: 10;
      overflow: hidden;
      padding-left: 14px;
      padding-right: 14px;
      padding-bottom: 10px;
      gap: 8px;
    `;

    function setWrapperSize() {
      const vp = window.visualViewport;
      if (vp) {

    // ── Helpers ──
    const formatTime = s => '⏱ ' + Math.floor(s/60) + ':' + (s%60).toString().padStart(2,'0');
    const startStopwatch = () => { if (stopwatchInterval) return; stopwatchInterval = setInterval(() => { stopwatchEl.textContent = formatTime(++stopwatchSeconds); }, 1000); };
    const pauseStopwatch = () => { clearInterval(stopwatchInterval); stopwatchInterval = null; };
    const stopStopwatch  = () => { clearInterval(stopwatchInterval); stopwatchInterval = null; };
    const getCurrentWord = () => words[currentIdx];

    function updateScoreBadges() {
      const cc = document.getElementById('correct-count');
      const wc = document.getElementById('wrong-count');

    function updateDisplay(done) {
      progressBar.update(done, total);
      pctLabel.textContent = (total > 0 ? Math.round(done/total*100) : 0) + '%';

      updateScoreBadges();
      clearInput();

      // Clear feedback without moving anything (fixed-height container)
      feedbackEl.textContent = '';
      feedbackEl.style.color = '';
      if (!isPaused) setTimeout(() => wordInput.focus(), 50);
    }

    function showFeedback(isCorrect, msg) {
      feedbackEl.textContent = msg || (isCorrect ? '✅ Correct!' : '❌ Wrong!');
      feedbackEl.style.color = isCorrect ? 'var(--bee-green)' : 'var(--bee-red)';
    }

    function startWordTimer() {
      if (timerDuration === 0) return;
      timerCircle.update(timerDuration, timerDuration);
      startTimer(timerDuration,
        (rem, tot) => timerCircle.update(rem, tot),
        () => { showFeedback(false, '⏰ Time up!'); setTimeout(() => advanceWord(false), 800); }
      );
    }

    function advanceWord(wasCorrect) {
      stopTimer();
      if (wasCorrect) correctCount++; else wrongWords.push(getCurrentWord());
      updateScoreBadges();
      const done = correctCount + wrongWords.length;
      if (done >= total) { endSession(); return; }
      currentIdx++;
      updateDisplay(done);
      speakWord(getCurrentWord(), voiceProfile);
      startWordTimer();
    }

    async function endSession() {
      stopTimer(); stopSpeaking(); stopStopwatch(); cleanup();
      const listName = state.currentList ? state.currentList.name : 'Unknown';
      if (!state.retryWords) await saveAttempt({ score: correctCount, total, listName, wrongWords, mode: 'self' });
      setState({ sessionScore: correctCount, wrongWords });
      navigate('results', { score: correctCount, total, wrongWords, listName });
    }

    const doSubmit = () => {
      if (isPaused) return;
      const answer = normalizeAnswer(getInputValue());
      if (!answer) { showToast('Type your answer first!'); return; }
      const isRight = answer === normalizeAnswer(getCurrentWord());
      showFeedback(isRight);
      stopTimer();
      setTimeout(() => advanceWord(isRight), 900);
    };

    submitBtn.addEventListener('click', doSubmit);
    wordInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); doSubmit(); }
    });

    spellBtn.addEventListener('click', () => { if (!isPaused) speakWord(getCurrentWord(), voiceProfile); });

    skipBtn.addEventListener('click', () => {
      if (isPaused) return;
      stopTimer();
      const w = words.splice(currentIdx, 1)[0];
      words.push(w);
      if (currentIdx >= words.length) currentIdx = 0;
      updateDisplay(correctCount + wrongWords.length);
      speakWord(getCurrentWord(), voiceProfile);
      startWordTimer();
      showToast('Word moved to end ⏭');
    });

    exitBtn.addEventListener('click', () => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = '<div class="modal-box" style="text-align:center;"><div style="font-size:40px;margin-bottom:8px;">🚪</div><div class="modal-title">Exit Practice?</div><div style="font-size:14px;color:var(--text-muted);font-weight:600;margin-bottom:16px;">Progress will be saved.</div><div class="modal-btns"><button class="btn btn-ghost" id="exit-cancel">Keep Going</button><button class="btn btn-danger" id="exit-confirm">Exit</button></div></div>';
      document.body.appendChild(overlay);
      overlay.querySelector('#exit-cancel').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#exit-confirm').addEventListener('click', async () => {
        overlay.remove(); stopTimer(); stopSpeaking(); stopStopwatch(); cleanup();
        const listName = state.currentList ? state.currentList.name : 'Unknown';
        if (!state.retryWords && correctCount + wrongWords.length > 0)
          await saveAttempt({ score: correctCount, total: correctCount + wrongWords.length, listName, wrongWords, mode: 'self' });
        setState({ sessionScore: 0, wrongWords: [], practiceWords: [] });
        navigate('home');
      });
    });

    let pausedOverlay = null;
    pauseBtn.addEventListener('click', () => {
      if (!isPaused) {
        isPaused = true;
        pauseTimer(); pauseStopwatch(); stopSpeaking();
        pauseBtn.querySelector('.test-action-icon').textContent = '▶';
        pauseBtn.querySelector('.test-action-label').textContent = 'Resume';
        pausedOverlay = document.createElement('div');
        pausedOverlay.className = 'paused-overlay';
        pausedOverlay.innerHTML = '<div class="paused-box"><div class="paused-icon">⏸</div><div class="paused-text">Paused</div><div style="font-size:13px;color:var(--text-muted);margin-top:6px;font-weight:600;">Tap to resume</div></div>';
        pausedOverlay.addEventListener('click', () => pauseBtn.click());
        document.body.appendChild(pausedOverlay);
      } else {
        isPaused = false;
        pauseBtn.querySelector('.test-action-icon').textContent = '⏸';
        pauseBtn.querySelector('.test-action-label').textContent = 'Pause';
        if (pausedOverlay) { pausedOverlay.remove(); pausedOverlay = null; }
        startStopwatch();
        setTimeout(() => wordInput.focus(), 50);
        if (timerDuration > 0) {
          resumeTimer(
            (rem, t) => timerCircle.update(rem, t),
            () => { showFeedback(false, '⏰ Time up!'); setTimeout(() => advanceWord(false), 800); },
            timerDuration
          );
        }
      }
    });

    updateDisplay(0);
    speakWord(getCurrentWord(), voiceProfile);
    startWordTimer();
    startStopwatch();
    setTimeout(() => wordInput.focus(), 150);
  }

  // Header
  const header = document.createElement('div');
  header.className = 'screen-header';
  header.appendChild(BackButton('home'));
  const title = document.createElement('div');
  title.className = 'screen-title';
  title.textContent = 'Results';
  header.appendChild(title);
  screen.appendChild(header);

  // Score hero
  const hero = document.createElement('div');
  hero.className = 'results-hero';
  hero.innerHTML = `
    <div class="results-score">${score}/${total}</div>
    <div class="results-label">${listName} · ${accuracy}% accuracy</div>
    <div class="stars-row">${stars}</div>
  `;

  // Wrong words
  if (wrongWords.length > 0) {
    const card = document.createElement('div');
    card.className = 'results-card';
    card.innerHTML = `<div class="results-card-title">Words to practice (${wrongWords.length})</div>`;

    const pillsWrap = document.createElement('div');

    perfect.className = 'results-card text-center';

    screen.appendChild(perfect);

  // Buttons
  const btns = document.createElement('div');
  btns.className = 'results-btns mt-16';

  if (wrongWords.length > 0) {
    const retryBtn = document.createElement('button');
    retryBtn.className = 'btn btn-warning btn-full';
    retryBtn.style.fontSize = '17px';
    retryBtn.textContent = '🔄 Retry Wrong Words';
    retryBtn.addEventListener('click', () => {
      setState({
        retryWords: shuffleWords(wrongWords),
        currentWordIndex: 0,
        sessionScore: 0,
        wrongWords: [],
        correctWords: [],
        isPaused: false,
      });
      navigate('test');
    });
    btns.appendChild(retryBtn);
  }

  const homeBtn = document.createElement('button');
  homeBtn.className = 'btn btn-primary btn-full';
  homeBtn.style.fontSize = '17px';
  homeBtn.textContent = '🏠 Home';
  homeBtn.addEventListener('click', () => navigate('home'));
  btns.appendChild(homeBtn);

  screen.appendChild(btns);
  container.appendChild(screen);
}


// ── history.js ──






function formatDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric'
  });
}

async function renderHistory(container) {
  const screen = document.createElement('div');
  screen.className = 'screen';

  const header = document.createElement('div');
  header.className = 'screen-header';
  header.appendChild(BackButton('home'));
  const title = document.createElement('div');
  title.className = 'screen-title';
  title.textContent = 'History 🏆';
  header.appendChild(title);
  screen.appendChild(header);

  const [history, topRecords] = await Promise.all([getAllHistory(), getTopRecords()]);

  const total = history.length;
  const bestScore = history.length > 0
    ? Math.max(...history.map(e => e.total > 0 ? Math.round(e.score / e.total * 100) : 0))
    : 0;
  const avgAccuracy = history.length > 0
    ? Math.round(history.reduce((acc, e) => acc + (e.total > 0 ? e.score / e.total * 100 : 0), 0) / history.length)
    : 0;

  const statsRow = document.createElement('div');
  statsRow.className = 'history-stat-row';
  statsRow.innerHTML = `
    <div class="history-stat-card">
      <div class="history-stat-val">${bestScore}%</div>
      <div class="history-stat-label">Best Score</div>
    </div>
    <div class="history-stat-card">
      <div class="history-stat-val">${total}</div>
      <div class="history-stat-label">Attempts</div>
    </div>
    <div class="history-stat-card">
      <div class="history-stat-val">${avgAccuracy}%</div>
      <div class="history-stat-label">Avg Accuracy</div>
    </div>
  `;
  screen.appendChild(statsRow);

  if (topRecords.length > 0) {
    const recordsHeading = document.createElement('div');
    recordsHeading.className = 'section-heading';
    recordsHeading.textContent = '🏅 Top Records';
    screen.appendChild(recordsHeading);

    topRecords.slice(0, 5).forEach((record, i) => {
      const pct = record.total > 0 ? Math.round(record.score / record.total * 100) : 0;
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
      const el = document.createElement('div');
      el.className = 'history-record';
      el.innerHTML = `
        <div class="history-record-score">${medal}</div>
        <div class="history-record-info">
          <div class="history-record-list">${record.listName}</div>
          <div class="history-record-date">${formatDate(record.date)} · ${record.score}/${record.total}</div>
        </div>
        <div class="history-record-badge">${pct}%</div>
      `;
      screen.appendChild(el);
    });
  }

  if (history.length > 0) {
    const recentHeading = document.createElement('div');
    recentHeading.className = 'section-heading mt-16';
    recentHeading.textContent = '📋 Recent Attempts';
    screen.appendChild(recentHeading);

    history.slice(0, 20).forEach(entry => {
      const pct = entry.total > 0 ? Math.round(entry.score / entry.total * 100) : 0;
      const stars = getStars(pct);
      const el = document.createElement('div');
      el.className = 'history-record';
      el.innerHTML = `
        <div class="history-record-score" style="font-size:18px;">${stars}</div>
        <div class="history-record-info">
          <div class="history-record-list">${entry.listName} · ${entry.mode === 'coach' ? '🧑' : '🎧'}</div>
          <div class="history-record-date">${formatDate(entry.date)} · ${entry.score}/${entry.total}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          <div class="history-record-badge">${pct}%</div>
          ${entry.wrongWords && entry.wrongWords.length > 0
            ? `<div style="font-size:11px;color:var(--text-muted);font-weight:700;">${entry.wrongWords.length} wrong</div>`
            : ''}
        </div>
      `;
      if (entry.wrongWords && entry.wrongWords.length > 0) {
        el.style.cursor = 'pointer';
        el.title = 'Tap to retry wrong words';
        el.addEventListener('click', () => {
          setState({
            retryWords: shuffleWords(entry.wrongWords),
            currentWordIndex: 0,
            sessionScore: 0,
            wrongWords: [],
            correctWords: [],
            timerDuration: 10,
            practiceMode: entry.mode || 'coach',
          });
          navigate('test');
        });
      }
      screen.appendChild(el);
    });
  } else {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `
      <div class="empty-state-icon">📭</div>
      <div class="empty-state-text">No history yet</div>
      <div class="empty-state-sub">Complete a practice session to see results here</div>
    `;
    screen.appendChild(empty);
  }

  container.appendChild(screen);
}

  async function selectAccent(code) {
    voiceCountry = code;
    await saveVoiceCountry(code);

    const gender = prof ? prof.gender : 'female';
    const newProf = (
      VOICE_PROFILES.find(p => p.lang === code && p.gender === gender) ||
      VOICE_PROFILES.find(p => p.lang === code) ||
      VOICE_PROFILES[1]

    await saveVoiceProfile(newProf.id);
    setState({ voiceProfile: newProf.id });

  refreshBtn.textContent = '🔄';

// ── listManagement.js ──







async function renderListManagement(container) {
  const screen = document.createElement('div');
  screen.className = 'screen';

  const header = document.createElement('div');
  header.className = 'screen-header';
  header.appendChild(BackButton('home'));
  const title = document.createElement('div');
  title.className = 'screen-title';
  title.textContent = 'My Lists 📚';
  header.appendChild(title);
  screen.appendChild(header);

  // State
  let selectedList = null;
  let lists = await getAllLists();

  // ---- Top actions ----
  const topActions = document.createElement('div');
  topActions.className = 'list-mgmt-actions';

  const createBtn = document.createElement('button');
  createBtn.className = 'btn btn-primary';
  createBtn.textContent = '＋ New List';

  const importBtn = document.createElement('button');
  importBtn.className = 'btn btn-ghost';
  importBtn.textContent = '📥 Import';

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.txt,.csv';
  fileInput.style.display = 'none';

  topActions.appendChild(createBtn);
  topActions.appendChild(importBtn);
  topActions.appendChild(fileInput);
  screen.appendChild(topActions);

  // ---- Lists container ----
  const listsContainer = document.createElement('div');
  screen.appendChild(listsContainer);

  // ---- Word editor (shown when a list is selected) ----
  const editorSection = document.createElement('div');
  editorSection.style.display = 'none';
  screen.appendChild(editorSection);

  // ---- Render lists ----
  function renderLists() {
    listsContainer.innerHTML = '';

    if (lists.length === 0) {
      listsContainer.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-text">No lists yet</div>
          <div class="empty-state-sub">Tap "New List" to get started</div>
        </div>
      `;
      return;
    }

    const label = document.createElement('div');
    label.className = 'section-heading';
    label.textContent = 'Your lists';
    listsContainer.appendChild(label);

    lists.forEach(list => {
      const card = ListCard({
        list,
        showActions: true,
        selected: selectedList && selectedList.id === list.id,
        onEdit: (l) => openEditor(l),
        onDelete: (l) => confirmDelete(l),
      });
      card.addEventListener('click', () => openEditor(list));
      listsContainer.appendChild(card);
    });
  }

  // ---- Open editor ----
  async function openEditor(list) {
    selectedList = await getList(list.id);
    editorSection.style.display = 'block';
    renderEditor();
    editorSection.scrollIntoView({ behavior: 'smooth' });
    renderLists();
  }

  function renderEditor() {
    if (!selectedList) return;
    editorSection.innerHTML = '';

    const editorTitle = document.createElement('div');
    editorTitle.className = 'screen-header';
    editorTitle.style.marginTop = '16px';

    const edIcon = document.createElement('span');
    edIcon.textContent = selectedList.icon || '📚';
    edIcon.style.fontSize = '28px';

    const edName = document.createElement('div');
    edName.className = 'screen-title';
    edName.style.fontSize = '20px';
    edName.textContent = selectedList.name;

    const closeBtn = document.createElement('button');
    closeBtn.className = 'back-btn';
    closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', () => {
      editorSection.style.display = 'none';
      selectedList = null;
      renderLists();
    });

    editorTitle.appendChild(edIcon);
    editorTitle.appendChild(edName);
    editorTitle.appendChild(closeBtn);
    editorSection.appendChild(editorTitle);

    // Word count
    const countEl = document.createElement('div');
    countEl.className = 'section-heading';
    countEl.textContent = `${selectedList.words.length} words`;
    editorSection.appendChild(countEl);

    // Words display
    const wordsWrap = document.createElement('div');
    wordsWrap.className = 'words-container';

    function renderWordPills() {
      wordsWrap.innerHTML = '';
      if (selectedList.words.length === 0) {
        wordsWrap.innerHTML = '<div style="color:var(--text-muted);font-size:14px;font-weight:600;text-align:center;padding:16px;">No words yet. Add some below!</div>';
        return;
      }
      selectedList.words.forEach(word => {
        const pill = document.createElement('span');
        pill.className = 'word-pill';
        const displayWord = word.charAt(0).toUpperCase() + word.slice(1);
        pill.innerHTML = `${displayWord} <button class="word-pill-del" data-word="${word}">✕</button>`;
        pill.querySelector('.word-pill-del').addEventListener('click', async () => {
          selectedList = await removeWordFromList(selectedList.id, word);
          countEl.textContent = `${selectedList.words.length} words`;
          renderWordPills();
          refreshLists();
        });
        wordsWrap.appendChild(pill);
      });
    }

    renderWordPills();
    editorSection.appendChild(wordsWrap);

    // Add word input
    const addRow = document.createElement('div');
    addRow.className = 'flex gap-8 mb-12';

    const addInput = document.createElement('input');
    addInput.className = 'modal-input';
    addInput.style.margin = '0';
    addInput.style.flex = '1';
    addInput.placeholder = 'Type a word...';
    addInput.autocorrect = 'off';
    addInput.autocapitalize = 'off';
    addInput.spellcheck = false;

    const addWordBtn = document.createElement('button');
    addWordBtn.className = 'btn btn-primary';
    addWordBtn.textContent = '＋ Add';

    const doAddWord = async () => {
      const word = addInput.value.trim().toLowerCase();
      if (!word) return;
      if (selectedList.words.includes(word)) {
        showToast('Word already in list!');
        return;
      }
      selectedList = await addWordToList(selectedList.id, word);
      addInput.value = '';
      countEl.textContent = `${selectedList.words.length} words`;
      renderWordPills();
      refreshLists();
    };

    addWordBtn.addEventListener('click', doAddWord);
    addInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doAddWord(); });

    addRow.appendChild(addInput);
    addRow.appendChild(addWordBtn);
    editorSection.appendChild(addRow);
  }

  // ---- Confirm delete ----
  function confirmDelete(list) {
    showModal({
      title: `Delete "${list.name}"?`,
      confirmLabel: '🗑️ Delete',
      confirmClass: 'btn-danger',
      onConfirm: async () => {
        await removeList(list.id);
        if (selectedList && selectedList.id === list.id) {
          editorSection.style.display = 'none';
          selectedList = null;
        }
        await refreshLists();
        showToast('List deleted');
      }
    });
  }

  // ---- Create list modal ----
  createBtn.addEventListener('click', () => {
    showModal({
      title: 'New List',
      inputPlaceholder: 'List name...',
      confirmLabel: '✨ Create',
      confirmClass: 'btn-primary',
      onConfirm: async (name) => {
        if (!name || !name.trim()) { showToast('Please enter a name'); return; }
        const newList = await createList(name.trim());
        await refreshLists();
        await openEditor(newList);
        showToast(`"${newList.name}" created!`);
      }
    });
  });

  // ---- Import ----
  importBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;

    const text = await file.text();
    let words = [];

    if (file.name.endsWith('.csv')) {
      words = text.split(/[\n,]/).map(w => w.trim().replace(/"/g, '').toLowerCase()).filter(Boolean);
    } else {
      words = text.split(/\n/).map(w => w.trim().toLowerCase()).filter(Boolean);
    }

    words = [...new Set(words)]; // deduplicate

    const listName = file.name.replace(/\.(txt|csv)$/i, '');
    const newList = await createList(listName, words);
    await refreshLists();
    await openEditor(newList);
    showToast(`Imported ${words.length} words!`);
    fileInput.value = '';
  });

  async function refreshLists() {
    lists = await getAllLists();
    renderLists();
  }

  renderLists();
  container.appendChild(screen);
}

// ---- Modal helper ----
function showModal({ title, inputPlaceholder, confirmLabel, confirmClass, onConfirm }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const box = document.createElement('div');
  box.className = 'modal-box';

  const modalTitle = document.createElement('div');
  modalTitle.className = 'modal-title';
  modalTitle.textContent = title;
  box.appendChild(modalTitle);

  let inputEl = null;
  if (inputPlaceholder) {
    inputEl = document.createElement('input');
    inputEl.className = 'modal-input';
    inputEl.placeholder = inputPlaceholder;
    inputEl.autocorrect = 'off';
    inputEl.spellcheck = false;
    box.appendChild(inputEl);
    setTimeout(() => inputEl.focus(), 100);
  }

  const btns = document.createElement('div');
  btns.className = 'modal-btns';

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-ghost';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', () => overlay.remove());

  const confirmBtn = document.createElement('button');
  confirmBtn.className = `btn ${confirmClass}`;
  confirmBtn.textContent = confirmLabel;
  confirmBtn.addEventListener('click', () => {
    overlay.remove();
    onConfirm(inputEl ? inputEl.value : null);
  });

  if (inputEl) {
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirmBtn.click();
    });
  }

  btns.appendChild(cancelBtn);
  btns.appendChild(confirmBtn);
  box.appendChild(btns);

  overlay.appendChild(box);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}


// ── Router ──
const routes = {
  splash:         renderSplash,
  home:           renderHome,
  practice:       renderPractice,
  setup:          renderSetup,
  test:           renderTest,
  results:        renderResults,
  history:        renderHistory,
  settings:       renderSettings,
  listManagement: renderListManagement,
};

const appEl = document.getElementById('app');

function navigate(screen, params = {}) {
  const renderer = routes[screen];
  if (!renderer) { console.error('No route:', screen); return; }
  appEl.innerHTML = '';
  renderer(appEl, params);
}

// ── Init ──
async function init() {
  try {
    const theme = await getSetting('theme');
    const defaultTimer = await getSetting('defaultTimer');
    document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
    setState({ theme: theme || 'light' });
    if (defaultTimer !== null) setState({ defaultTimer, timerDuration: defaultTimer });
  } catch(e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  navigate('splash');
}

init();

  </script>
